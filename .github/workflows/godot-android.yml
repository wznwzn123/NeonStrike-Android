name: Build Neon Strike Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - godot-rebuild
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Godot
        run: godot --version

      - name: Import and validate project scripts
        run: godot --headless --editor --path godot --import --quit

      - name: Export Android APK
        run: |
          mkdir -p godot/build
          godot --headless --verbose --path godot --export-debug "Android" godot/build/NeonStrike.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonStrike-Godot-Android
          path: godot/build/NeonStrike.apk
          if-no-files-found: error
